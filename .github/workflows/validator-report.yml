name: Validator Report

on:
  workflow_call:

permissions:
  contents: write

env:
  RPC_NODE: 'https://rpc.provider-archive-01.hub-testnet.polypore.xyz'
  API_NODE: 'https://rest.provider-archive-01.hub-testnet.polypore.xyz'

jobs:
  validator-report:
    runs-on: cosmos-runner-set
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wget, curl, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get current running gaiad version
        run: |
          RUNNING_VERSION=$(curl -s $RPC_NODE/abci_info | jq -r '.result.response.version')
          echo "Running gaiad version: $RUNNING_VERSION"
          echo "RUNNING_VERSION=$RUNNING_VERSION" >> $GITHUB_ENV

      - name: Download binary from cosmos/gaia repo
        run: |
          sudo wget -nv https://github.com/cosmos/gaia/releases/download/${{ env.RUNNING_VERSION }}/gaiad-${{ env.RUNNING_VERSION }}-linux-amd64 -O /usr/local/bin/gaiad
          sudo chmod +x /usr/local/bin/gaiad
          gaiad version

      - name: Compute last month
        id: date
        run: echo "period=$(date -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Run validator report
        working-directory: src
        run: |
          python validator_report.py \
            -r "$RPC_NODE" \
            -a "$API_NODE" \
            -p ${{ steps.date.outputs.period }}

      - name: Move report into data_collected directory
        id: move
        run: |
          PERIOD="${{ steps.date.outputs.period }}"
          YEAR=$(date -d "${PERIOD}-01" +%Y)
          MONTH=$(date -d "${PERIOD}-01" +%m)
          DEST_DIR="data_collected/$YEAR/$MONTH"
          mkdir -p "$DEST_DIR"
          mv "src/validator_report.$PERIOD.csv" "$DEST_DIR/"
          echo "report_path=$DEST_DIR/validator_report.$PERIOD.csv" >> "$GITHUB_OUTPUT"

      - name: Upload validator report CSV
        uses: actions/upload-artifact@v7
        with:
          name: validator-report-${{ steps.date.outputs.period }}
          path: ${{ steps.move.outputs.report_path }}
