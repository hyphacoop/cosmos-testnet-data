name: Collect Cosmos Testnet Data

on:
  workflow_dispatch:
  schedule:
    # Run on the 1st of every month (covers the previous month)
    - cron: '0 0 1 * *'

jobs:
  uptime-tracker:
    uses: ./.github/workflows/uptime-tracker.yml
    secrets: inherit

  validator-report:
    uses: ./.github/workflows/validator-report.yml
    secrets: inherit
