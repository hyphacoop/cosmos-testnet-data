name: Uptime Tracker

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, UTC, inclusive)'
        required: true
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD, UTC, inclusive)'
        required: true
        type: string

env:
  RPC_NODE: 'https://rpc.provider-sentry-02.hub-testnet.polypore.xyz'
  API_NODE: 'https://rest.provider-sentry-01.hub-testnet.polypore.xyz'

jobs:
  uptime-tracker:
    runs-on: cosmos-runner-set
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install wget, curl, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get current running gaiad version
        run: |
          #RUNNING_VERSION=$(curl -s $RPC_NODE/abci_info | jq -r '.result.response.version')
          RUNNING_VERSION="v28.0.0"
          echo "Running gaiad version: $RUNNING_VERSION"
          echo "RUNNING_VERSION=$RUNNING_VERSION" >> $GITHUB_ENV

      - name: Download binary from cosmos/gaia repo
        run: |
          sudo wget -nv https://github.com/cosmos/gaia/releases/download/${{ env.RUNNING_VERSION }}/gaiad-${{ env.RUNNING_VERSION }}-linux-amd64 -O /usr/local/bin/gaiad
          sudo chmod +x /usr/local/bin/gaiad
          gaiad version

      - name: Compute period
        id: date
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            for d in "$START_DATE" "$END_DATE"; do
              if [ "$(date -d "$d" +%F 2>/dev/null)" != "$d" ]; then
                echo "::error::Invalid date '$d', expected YYYY-MM-DD"
                exit 1
              fi
            done
            if [[ "$START_DATE" > "$END_DATE" ]]; then
              echo "::error::start_date must not be after end_date"
              exit 1
            fi
            echo "period=${START_DATE}_${END_DATE}" >> "$GITHUB_OUTPUT"
            echo "args=--start-date $START_DATE --end-date $END_DATE" >> "$GITHUB_OUTPUT"
          else
            PERIOD=$(date -d 'last month' +%Y-%m)
            echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
            echo "args=-m $PERIOD" >> "$GITHUB_OUTPUT"
          fi

      - name: Run uptime tracker
        working-directory: src
        run: |
          python uptime_tracker.py \
            -r "$RPC_NODE" \
            -a "$API_NODE" \
            ${{ steps.date.outputs.args }}

      - name: Upload uptime CSV
        uses: actions/upload-artifact@v7
        with:
          name: uptime-${{ steps.date.outputs.period }}
          path: src/${{ steps.date.outputs.period }}-*-uptime.csv
